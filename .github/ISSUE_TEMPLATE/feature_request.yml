name: 💡 功能与特性建议
description: 为本项目提出新的功能想法、演练实验或工程改进建议
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您提出改进建议！我们热烈欢迎使本课程更贴合生产与云原生实践的建议。
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题或业务诉求
      description: 这个特性是否与某个实际痛点有关？请清晰描述。
      placeholder: 在目前的设计中...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案描述
      description: 您希望我们如何实现或扩展此功能？
      placeholder: 建议在 Day XX 中增加...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 您是否考虑过其他实现方案？为什么现在的方案更优？
